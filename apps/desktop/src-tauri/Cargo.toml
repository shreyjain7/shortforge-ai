[package]
name = "shortforge"
version = "0.2.1"
description = "ShortForge AI - local autonomous Shorts studio"
authors = ["ShortForge contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "shortforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
