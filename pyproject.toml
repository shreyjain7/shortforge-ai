[project]
name = "shortforge"
version = "0.1.0"
description = "ShortForge AI - local, privacy-first autonomous Shorts studio"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "yt-dlp[default]>=2025.10.0",
    "faster-whisper>=1.1.0",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.3",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
    "keyring>=25.2",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "fonttools>=4.50",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
shortforge-server = "shortforge.server:main"
shortforge = "shortforge.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
shortforge = ["database/migrations/*.ini", "database/migrations/**/*.py", "database/migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that require internet access (deselect with -m 'not network')",
    "gpu: tests that require a CUDA GPU",
    "slow: slow end-to-end tests",
]
addopts = "-m 'not network and not slow' -p no:cacheprovider --basetemp=build/pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM108", "RUF012"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
